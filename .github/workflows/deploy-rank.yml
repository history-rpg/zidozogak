# 랭킹 창구(Cloudflare Worker + D1)를 배포한다.
# 필요한 금고(Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# 결과는 저장소 맨 위의 deploy-status.txt 와 rank-url.txt 에 적어 둔다 (게임이 rank-url.txt 를 읽음).
name: 랭킹 창구 배포
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-rank.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-rank
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 금고 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "금고에 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 아직 없습니다." | tee /tmp/why.txt
            exit 1
          fi
      - name: wrangler 설치
        run: npm i -g wrangler@4.151.2
      - name: D1 데이터베이스 준비
        working-directory: worker
        run: |
          set -o pipefail
          get_id() { wrangler d1 list --json 2>/tmp/d1err.txt | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const d=a.find(x=>x.name==="jido-rank");console.log(d?(d.uuid||d.database_id||""):"")}catch(e){console.log("")}})'; }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            wrangler d1 create jido-rank 2>&1 | tee /tmp/d1create.txt || { cat /tmp/d1err.txt /tmp/d1create.txt > /tmp/why.txt; exit 1; }
            ID=$(get_id)
          fi
          if [ -z "$ID" ]; then { echo "D1 데이터베이스를 만들거나 찾지 못했습니다 (토큰에 D1 편집 권한이 있는지 확인)."; cat /tmp/d1err.txt; } > /tmp/why.txt; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute jido-rank --remote --yes --file=schema.sql 2>&1 | tail -20 | tee /tmp/schema.txt || { cp /tmp/schema.txt /tmp/why.txt; exit 1; }
      - name: 창구 배포
        working-directory: worker
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee /tmp/deploy.txt || { tail -30 /tmp/deploy.txt > /tmp/why.txt; exit 1; }
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1)
          if [ -z "$URL" ]; then { echo "배포는 됐지만 workers.dev 주소를 찾지 못했습니다 (Workers 화면에서 workers.dev 하위 도메인을 정했는지 확인)."; tail -30 /tmp/deploy.txt; } > /tmp/why.txt; exit 1; fi
          echo "$URL" > ../rank-url.txt
          curl -s "$URL/" | tee /tmp/ping.txt
      - name: 결과 적기 (성공)
        if: success()
        run: |
          { echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat rank-url.txt; cat /tmp/ping.txt; } > deploy-status.txt
      - name: 결과 적기 (실패)
        if: failure()
        run: |
          { echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat /tmp/why.txt 2>/dev/null; } > deploy-status.txt
          git checkout -- rank-url.txt 2>/dev/null || true
      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/wrangler.toml
          git add deploy-status.txt rank-url.txt 2>/dev/null || git add deploy-status.txt
          git diff --cached --quiet || git commit -m "랭킹 창구 배포 결과" && git push
