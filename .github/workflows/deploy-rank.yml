# 랭킹 창구(Cloudflare Worker + D1)를 배포한다.
# 필요한 금고(Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# 결과는 저장소 맨 위의 deploy-status.txt 와 rank-url.txt 에 적어 둔다 (게임이 rank-url.txt 를 읽음).
name: 랭킹 창구 배포
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-rank.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy-rank
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 금고 확인
        shell: bash {0}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "금고에 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 아직 없습니다." | tee /tmp/why.txt
            exit 1
          fi
      - name: wrangler 설치
        run: npm i -g wrangler@4.151.2 > /tmp/npm.txt 2>&1 || { tail -20 /tmp/npm.txt > /tmp/why.txt; exit 1; }
      - name: D1 데이터베이스 준비
        working-directory: worker
        shell: bash {0}
        run: |
          get_id() { wrangler d1 list --json > /tmp/d1list.json 2>/tmp/d1err.txt; node -e 'const fs=require("fs");let s=fs.readFileSync("/tmp/d1list.json","utf8");try{const a=JSON.parse(s.slice(s.indexOf("[")));const d=a.find(x=>x.name==="jido-rank");console.log(d?(d.uuid||d.database_id||""):"")}catch(e){console.log("")}'; }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            wrangler d1 create jido-rank > /tmp/d1create.txt 2>&1
            ID=$(get_id)
          fi
          if [ -z "$ID" ]; then
            { echo "D1 데이터베이스를 만들거나 찾지 못했습니다."; echo "--- d1 list"; head -c 1500 /tmp/d1list.json; echo; tail -20 /tmp/d1err.txt; echo "--- d1 create"; tail -30 /tmp/d1create.txt 2>/dev/null; } > /tmp/why.txt
            exit 1
          fi
          echo "D1 id: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute jido-rank --remote --yes --file=schema.sql > /tmp/schema.txt 2>&1 || { { echo "표 만들기 실패"; tail -30 /tmp/schema.txt; } > /tmp/why.txt; exit 1; }
          tail -5 /tmp/schema.txt
      - name: 창구 배포
        working-directory: worker
        shell: bash {0}
        run: |
          wrangler deploy > /tmp/deploy.txt 2>&1 || { { echo "배포 실패"; tail -40 /tmp/deploy.txt; } > /tmp/why.txt; exit 1; }
          cat /tmp/deploy.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1)
          if [ -z "$URL" ]; then { echo "배포는 됐지만 workers.dev 주소를 찾지 못했습니다."; tail -30 /tmp/deploy.txt; } > /tmp/why.txt; exit 1; fi
          echo "$URL" > ../rank-url.txt
          sleep 5
          curl -s "$URL/" > /tmp/ping.txt; cat /tmp/ping.txt
      - name: 결과 적기 (성공)
        if: success()
        run: |
          { echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat rank-url.txt; cat /tmp/ping.txt; } > deploy-status.txt
      - name: 결과 적기 (실패)
        if: failure()
        run: |
          { echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat /tmp/why.txt 2>/dev/null; } > deploy-status.txt
          git checkout -- rank-url.txt 2>/dev/null || true
      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/wrangler.toml
          git add deploy-status.txt rank-url.txt 2>/dev/null || git add deploy-status.txt
          git diff --cached --quiet || git commit -m "랭킹 창구 배포 결과" && git push
